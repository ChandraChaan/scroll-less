<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(120deg,#1E1B4B 0%,#2B2A8C 45%,#5B4BFF 100%)}
.glow{position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.icon{position:absolute;left:84px;top:110px;width:280px;height:280px}
.text{position:absolute;left:420px;top:128px;color:#fff}
h1{margin:0;font-size:92px;font-weight:800;letter-spacing:-2px;line-height:1}
h1 span{color:#FF5C78}
p{margin:18px 0 0;font-size:34px;font-weight:500;opacity:.92;line-height:1.25}
.chip{display:inline-block;margin-top:26px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:600;border:1px solid rgba(255,255,255,.25)}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<img class="icon" src="../../assets/brand/icon.svg">
<div class="text"><h1>Scroll<span>Less</span></h1>
<p>Count every Reel and Short.<br>See how long you really scroll.</p>
<div class="chip">Private · On-device · No account</div></div>
</body></html>
