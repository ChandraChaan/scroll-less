<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:2400px;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#1E1B4B 0%,#2B2A8C 50%,#5B4BFF 100%)}
.glow{position:absolute;left:-200px;bottom:-300px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,92,120,.28),rgba(255,92,120,0) 65%)}
.cap{position:absolute;top:120px;left:80px;right:80px;color:#fff;text-align:center}
.cap h1{margin:0;font-size:78px;font-weight:800;letter-spacing:-2px;line-height:1.08}
.cap p{margin:22px 0 0;font-size:36px;opacity:.9;line-height:1.3}
.frame{position:absolute;left:135px;top:520px;width:810px;height:1800px;border-radius:70px;background:#0b0a1f;padding:18px;box-sizing:border-box;box-shadow:0 60px 120px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.12)}
.screen{width:100%;height:100%;border-radius:54px;overflow:hidden;background:#000}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.notch{position:absolute;left:50%;top:40px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#0b0a1f}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<div class="cap"><h1>__TITLE__</h1><p>__SUB__</p></div>
<div class="frame"><div class="screen"><img src="__IMG__"></div><div class="notch"></div></div>
</body></html>
