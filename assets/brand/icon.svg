<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2A8C"/>
      <stop offset="1" stop-color="#5B4BFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B0A3A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="820" cy="190" r="260" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="160" cy="900" r="220" fill="#000000" opacity="0.10"/>
  <!-- scrolling feed cards -->
  <g filter="url(#shadow)">
    <rect x="262" y="176" width="500" height="150" rx="42" fill="#FFFFFF" opacity="0.28"/>
    <rect x="262" y="364" width="500" height="296" rx="48" fill="url(#card)"/>
    <rect x="262" y="698" width="500" height="150" rx="42" fill="#FFFFFF" opacity="0.28"/>
  </g>
  <!-- play glyph on the active card -->
  <path d="M470 440 L470 584 L592 512 Z" fill="#4338CA"/>
  <!-- pause badge -->
  <circle cx="742" cy="700" r="128" fill="#FF5C78" stroke="#FFFFFF" stroke-width="22"/>
  <rect x="694" y="640" width="34" height="120" rx="12" fill="#FFFFFF"/>
  <rect x="756" y="640" width="34" height="120" rx="12" fill="#FFFFFF"/>
</svg>
